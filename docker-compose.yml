services:
  db:
    image: postgres:16-alpine
    container_name: logirest-db
    environment:
      POSTGRES_DB: ${DB_NAME:-logirest}
      POSTGRES_USER: ${DB_USER:-logirest}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logirest}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: logirest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: logirest-api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-logirest}:${DB_PASSWORD}@db:5432/${DB_NAME:-logirest}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: logirest-web
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db_data:
