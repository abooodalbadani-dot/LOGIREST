name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
  push:
    branches:
      - main
      - recovery/frontend-stabilization

jobs:
  baseline-enforcement:
    name: Baseline Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run baseline enforcement
        run: node scripts/baseline/enforce-ci.js