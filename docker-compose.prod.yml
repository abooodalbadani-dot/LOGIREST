# =============================================================================
# OTANTIK KITCHEN / LogiRest — Production Docker Compose
# =============================================================================
# Usage:
#   1. cp .env.example.prod .env.prod
#   2. Fill in all <GENERATE_SECURE_PASSWORD> values in .env.prod
#   3. DOCKER_BUILDKIT=1 docker compose -f docker-compose.prod.yml \
#        --env-file .env.prod up -d --build
#   4. First-boot database seed:
#      docker compose -f docker-compose.prod.yml exec api npm run prisma:seed
#
# BuildKit cache mounts:
#   Both `api` and `web` Dockerfiles use:
#     RUN --mount=type=cache,target=/root/.npm ...
#   This requires DOCKER_BUILDKIT=1 (default in Docker 23+, Buildx).
#   Set DOCKER_BUILDKIT=1 in your CI/CD environment or shell before building.
#
# Network topology:
#   - db      : internal only (expose 5432)  — never mapped to host
#   - redis   : internal only (expose 6379)  — never mapped to host
#   - api     : internal only (expose 4000)  — proxied by Caddy
#   - web     : internal only (expose 3000)  — proxied by Caddy
#   - minio   : 9001 bound to 127.0.0.1 only (admin console; firewall-restrict)
#   - caddy   : 80/443 public
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: logirest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logirest}
      POSTGRES_USER: ${DB_USER:-logirest}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-logirest}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT exposed to host — only accessible inside the Docker network
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: logirest-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT exposed to host — only accessible inside the Docker network
    expose:
      - "6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
      # BuildKit cache mount is defined in the Dockerfile itself:
      #   RUN --mount=type=cache,target=/root/.npm npm ci ...
      # Requires: DOCKER_BUILDKIT=1 (set in shell or CI env before build)
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: logirest-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?lock_timeout=5000&connect_timeout=10
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?lock_timeout=5000&connect_timeout=10
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 4000
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BASE_CURRENCY_CODE: ${BASE_CURRENCY_CODE}
      BASE_CURRENCY_NAME: ${BASE_CURRENCY_NAME}
      TRANSFER_OVERDUE_DAYS: ${TRANSFER_OVERDUE_DAYS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ENABLE_AUTO_FREEZE: ${ENABLE_AUTO_FREEZE}
      ENABLE_SLACK_ALERTS: ${ENABLE_SLACK_ALERTS}
      SLACK_VALIDATION_WEBHOOK_URL: ${SLACK_VALIDATION_WEBHOOK_URL}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
    # NOT exposed to host — Caddy proxies via Docker network
    expose:
      - "4000"
    volumes:
      # Persist user uploads between deployments
      - uploads_data:/app/apps/web/public/uploads
      - ./backups:/backups:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:4000/v1/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      # NEXT_PUBLIC_* vars MUST be passed as ARGs at build time — Next.js
      # bakes them into the client-side bundle during next build (standalone).
      # They cannot be injected at runtime via environment: for client bundles.
      # BuildKit cache mount is defined in the Dockerfile itself:
      #   RUN --mount=type=cache,target=/root/.npm npm ci ...
      # Requires: DOCKER_BUILDKIT=1 (set in shell or CI env before build)
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        BUILDKIT_INLINE_CACHE: "1"
    container_name: logirest-web
    # next.config.ts output:'standalone' produces apps/web/server.js
    # The WORKDIR in the production stage is /app, so the path is relative.
    command: ["node", "apps/web/server.js"]
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      # Runtime env vars available to SSR (server.js) and Server Components.
      # NEXT_PUBLIC_* are already baked into the bundle from build args above;
      # setting them here as well satisfies any process.env reads in SSR code.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_USE_MOCKS: "false"
      NEXT_PUBLIC_TRANSFER_OVERDUE_DAYS: ${NEXT_PUBLIC_TRANSFER_OVERDUE_DAYS}
      # Server-side only — used by SSR routes to reach API via Docker network
      API_URL: ${API_URL}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
    # NOT exposed to host — Caddy proxies via Docker network
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://127.0.0.1:3000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: logirest-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: logirest-minio
    restart: unless-stopped
    # NOT exposed to host — only reachable from Docker network on port 9000
    expose:
      - "9000"
    ports:
      # Admin console bound to loopback only — restrict further via firewall
      - "127.0.0.1:9001:9001"
    environment:
      # Root credentials — no hardcoded fallbacks in production
      MINIO_ROOT_USER: ${BACKUP_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16-alpine
    container_name: logirest-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # No fallback defaults — fail fast if secrets are missing
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: db
      PGPORT: 5432
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - uploads_data:/uploads:ro
    entrypoint: [ "sh", "-c", "while true; do sh /scripts/db-backup.sh; sleep 86400; done" ]

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
  minio_data:
  uploads_data:
