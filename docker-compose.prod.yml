# =============================================================================
# OTANTIK KITCHEN / LogiRest â€” Definitive Production Docker Compose
# =============================================================================
#
# USAGE:
#   1. cp .env.production.example .env.prod
#   2. Fill in every secret in .env.prod
#   3. Build and start all services:
#        DOCKER_BUILDKIT=1 docker compose \
#          -f docker-compose.prod.yml \
#          --env-file .env.prod \
#          up -d --build
#   4. First-boot database seed:
#        docker compose -f docker-compose.prod.yml \
#          --env-file .env.prod \
#          exec logirest-api npm run prisma:seed
#
# NETWORK TOPOLOGY  (all services on logirest_network bridge):
#   logirest-db        internal only  (5432)   â€” never mapped to host
#   logirest-redis     internal only  (6379)   â€” never mapped to host
#   logirest-minio     9000 internal  / 9001 â†’ 127.0.0.1 only (admin console)
#   logirest-api       internal only  (4000)   â€” proxied by Caddy
#   logirest-web       internal only  (3000)   â€” proxied by Caddy
#   logirest-prometheus internal only (9090)   â€” scraped by Grafana
#   logirest-grafana   internal only  (3001)   â€” proxied by Caddy (optional)
#   logirest-db-backup internal only           â€” cron backup sidecar
#   logirest-caddy     80 / 443 â†’ host         â€” public TLS termination
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE â€” PostgreSQL 16
  # ---------------------------------------------------------------------------
  logirest-db:
    image: postgres:16-alpine
    container_name: logirest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-logirest}
      POSTGRES_USER:     ${POSTGRES_USER:-logirest_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 when the server is accepting connections
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logirest_prod} -d ${POSTGRES_DB:-logirest}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    expose:
      - "5432"
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # CACHE / QUEUE â€” Redis 7
  # ---------------------------------------------------------------------------
  logirest-redis:
    image: redis:7-alpine
    container_name: logirest-redis
    restart: unless-stopped
    # Enable AOF persistence + password auth (REDIS_PASSWORD from .env.prod)
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      # AUTH required when password is set â€” pass it via redis-cli -a
      test:     ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 10s
    expose:
      - "6379"
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # OBJECT STORAGE â€” MinIO (S3-compatible)
  # ---------------------------------------------------------------------------
  logirest-minio:
    image: minio/minio:latest
    container_name: logirest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Root credentials â€” no hardcoded fallbacks in production
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # API port internal only; console bound to loopback (firewall-restrict further)
    expose:
      - "9000"
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # BACKEND â€” NestJS 11 API
  # ---------------------------------------------------------------------------
  logirest-api:
    build:
      context:    .
      dockerfile: apps/api/Dockerfile
      target:     production
      args:
        # Enables inline layer metadata for remote cache (BuildKit feature)
        BUILDKIT_INLINE_CACHE: "1"
    container_name: logirest-api
    restart: unless-stopped
    environment:
      NODE_ENV:    production
      PORT:        4000
      NODE_OPTIONS: --max-old-space-size=1024

      # Database â€” service name 'logirest-db' resolves inside logirest_network
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@logirest-db:5432/${POSTGRES_DB}?sslmode=disable&lock_timeout=5000&connect_timeout=10"
      DIRECT_URL:   "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@logirest-db:5432/${POSTGRES_DB}?sslmode=disable&lock_timeout=5000&connect_timeout=10"

      # Redis â€” include password in URL when REDIS_PASSWORD is set
      REDIS_URL:      "redis://:${REDIS_PASSWORD}@logirest-redis:6379"
      REDIS_HOST:     logirest-redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # CORS origin (public URL of the Next.js frontend)
      FRONTEND_URL: ${FRONTEND_URL}

      # Auth & Encryption
      JWT_ACCESS_SECRET:  ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY:     ${ENCRYPTION_KEY}

      # Business configuration
      BASE_CURRENCY_CODE:   ${BASE_CURRENCY_CODE:-USD}
      BASE_CURRENCY_NAME:   ${BASE_CURRENCY_NAME:-US Dollar}
      TRANSFER_OVERDUE_DAYS: ${TRANSFER_OVERDUE_DAYS:-7}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}

      # SMTP / Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      # Feature flags
      ENABLE_AUTO_FREEZE:  ${ENABLE_AUTO_FREEZE:-false}
      ENABLE_SLACK_ALERTS: ${ENABLE_SLACK_ALERTS:-false}

      # Webhooks & alert emails
      SLACK_VALIDATION_WEBHOOK_URL: ${SLACK_VALIDATION_WEBHOOK_URL}
      ALERT_WEBHOOK_URL:            ${ALERT_WEBHOOK_URL}
      VALIDATION_ALERT_EMAILS:      ${VALIDATION_ALERT_EMAILS}

      # MinIO / S3 backup credentials (service-account, not root)
      BACKUP_S3_ACCESS_KEY_ID:     ${BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_ENDPOINT:          ${BACKUP_S3_ENDPOINT:-http://logirest-minio:9000}
      BACKUP_S3_REGION:            ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET:            ${BACKUP_S3_BUCKET:-logirest-backups}
      BACKUP_ENCRYPTION_KEY:       ${BACKUP_ENCRYPTION_KEY}
    depends_on:
      logirest-db:
        condition: service_healthy
      logirest-redis:
        condition: service_healthy
    expose:
      - "4000"
    volumes:
      # Persist user-uploaded files across deployments
      - uploads_data:/app/apps/web/public/uploads
      - ./backups:/backups:ro
    healthcheck:
      test:     ["CMD-SHELL", "node -e \"const h=require('http');const o={host:'localhost',port:4000,path:'/health',timeout:2000};const r=h.request(o,res=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.end();\""]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus:   "1.5"
          memory: 1536M
        reservations:
          cpus:   "0.5"
          memory: 768M
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # FRONTEND â€” Next.js 16 (standalone)
  # ---------------------------------------------------------------------------
  logirest-web:
    build:
      context:    .
      dockerfile: apps/web/Dockerfile
      target:     production
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at BUILD TIME.
        # They cannot be injected at runtime for browser-side code.
        NEXT_PUBLIC_API_URL:   ${NEXT_PUBLIC_API_URL}
        BUILDKIT_INLINE_CACHE: "1"
    container_name: logirest-web
    restart: unless-stopped
    environment:
      PORT:        3000
      NODE_ENV:    production
      HOSTNAME:    "0.0.0.0"

      # NEXT_PUBLIC_* are already baked from build args; setting them here
      # additionally ensures process.env reads work in SSR/Server Components.
      NEXT_PUBLIC_API_URL:              ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_USE_MOCKS:            "false"
      NEXT_PUBLIC_TRANSFER_OVERDUE_DAYS: ${NEXT_PUBLIC_TRANSFER_OVERDUE_DAYS:-7}

      # Server-side only â€” reaches API through the Docker network (no TLS)
      API_URL: ${API_URL:-http://logirest-api:4000/api/v1}
    depends_on:
      logirest-api:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/apps/web/public/uploads:ro
      - ./backups:/backups:ro
    healthcheck:
      test:     ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: 1024M
        reservations:
          cpus:   "0.25"
          memory: 512M
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # METRICS COLLECTION â€” Prometheus
  # ---------------------------------------------------------------------------
  logirest-prometheus:
    image: prom/prometheus:latest
    container_name: logirest-prometheus
    restart: unless-stopped
    # Config mounts from the repo root â€” prometheus.yml scrapes logirest-api
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    expose:
      - "9090"
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # MONITORING DASHBOARD â€” Grafana
  # ---------------------------------------------------------------------------
  logirest-grafana:
    image: grafana/grafana:latest
    container_name: logirest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         ${GF_SERVER_ROOT_URL:-https://monitoring.yourdomain.com}
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
      # Bind Grafana to port 3001 — avoids collision with logirest-web on 3000
      # and matches the Caddyfile upstream: http://logirest-grafana:3001
      GF_SERVER_HTTP_PORT:        "3001"
      # Pre-configure Prometheus as the default data source
      GF_DATASOURCES_DEFAULT_URL: "http://logirest-prometheus:9090"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - logirest-prometheus
    expose:
      - "3001"
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # DATABASE BACKUPS â€” pg_dump sidecar with cron-style sleep loop
  # ---------------------------------------------------------------------------
  logirest-db-backup:
    image: postgres:16-alpine
    container_name: logirest-db-backup
    restart: unless-stopped
    environment:
      # PostgreSQL connection parameters (pg_dump reads these automatically)
      PGHOST:     logirest-db
      PGPORT:     "5432"
      PGDATABASE: ${POSTGRES_DB:-logirest}
      PGUSER:     ${POSTGRES_USER:-logirest_prod}
      PGPASSWORD: ${POSTGRES_PASSWORD}

      # MinIO / S3 upload credentials
      BACKUP_S3_ACCESS_KEY_ID:     ${BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_BUCKET:            ${BACKUP_S3_BUCKET:-logirest-backups}
      BACKUP_S3_ENDPOINT:          ${BACKUP_S3_ENDPOINT:-http://logirest-minio:9000}
      BACKUP_S3_REGION:            ${BACKUP_S3_REGION:-us-east-1}

      # AES-256 key for encrypting dumps before upload
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}

      # Backup schedule (cron format) and retention â€” read by db-backup.sh
      BACKUP_CRON_SCHEDULE:  ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      logirest-db:
        condition: service_healthy
      logirest-minio:
        condition: service_started
    volumes:
      - ./scripts:/scripts:ro         # db-backup.sh is in scripts/
      - db_backups:/backups           # persistent dump staging area
      - uploads_data:/uploads:ro      # include uploads in backup if needed
    # Sleep-loop entrypoint: run db-backup.sh once per BACKUP_CRON_SCHEDULE period.
    # BACKUP_CRON_SCHEDULE is in cron format (e.g. "0 2 * * *" = daily at 02:00).
    # The sleep duration is 86400s (24h); adjust to match your schedule frequency.
    entrypoint:
      - sh
      - -c
      - |
        echo "Backup sidecar started. Schedule: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}"
        while true; do
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Running db-backup.sh..."
          sh /scripts/db-backup.sh
          echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Backup complete. Sleeping 86400s..."
          sleep 86400
        done
    networks:
      - logirest_network

  # ---------------------------------------------------------------------------
  # REVERSE PROXY / TLS TERMINATION â€” Caddy 2
  # ---------------------------------------------------------------------------
  logirest-caddy:
    image: caddy:2-alpine
    container_name: logirest-caddy
    restart: unless-stopped
    # Caddy reads DOMAIN, API_DOMAIN, and FRONTEND_URL from the environment
    # and uses them in the Caddyfile via {$VAR} interpolation.
    environment:
      DOMAIN:       ${DOMAIN}
      API_DOMAIN:   ${API_DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL}
      ACME_EMAIL:   ${ACME_EMAIL}
    ports:
      - "80:80"     # HTTP â†’ HTTPS redirect + ACME HTTP-01 challenge
      - "443:443"   # HTTPS (TLS termination)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # Stage 5 â€” configured separately
      - caddy_data:/data                        # TLS certificates (ACME)
      - caddy_config:/config                   # Caddy runtime config cache
    depends_on:
      logirest-api:
        condition: service_healthy
      logirest-web:
        condition: service_healthy
    networks:
      - logirest_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  uploads_data:
    driver: local
  db_backups:
    driver: local
  prom_data:
    driver: local
  grafana_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  logirest_network:
    driver: bridge
    # All inter-service communication happens over this isolated bridge.
    # No service is reachable from the host except through explicit port mappings.
    name: logirest_network

